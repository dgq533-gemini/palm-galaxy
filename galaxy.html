<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>掌中星河 · AI 编程作品</title>
<style>*{box-sizing:border-box}body{margin:0;background:#060b12;color:#eef7f5;font:14px 'Microsoft YaHei',sans-serif;display:grid;place-items:center;min-height:100vh}canvas#film{height:100vh;max-width:100vw;object-fit:contain}#controls{position:fixed;bottom:16px;left:16px;display:flex;gap:8px;flex-wrap:wrap;max-width:95vw}button{background:#12212b;color:#eef7f5;border:1px solid #56e9df88;padding:10px 14px;border-radius:6px;cursor:pointer}#notice{position:fixed;top:12px;left:12px;background:#060b12df;padding:10px;max-width:350px}video{display:none}</style>
<canvas id="film" width="1080" height="1920"></canvas><video id="camera" muted playsinline></video><div id="notice">自动演示 · 手部骨架为示意；摄像头需点击授权。本地识别，不上传影像。</div><div id="controls"><button id="enable">开启真实手势</button><button data-mode="0">握拳 / 1</button><button data-mode="1">张手 / 2</button><button data-mode="2">捏合 / 3</button><button data-mode="3">挥动 / 4</button><button id="demo">自动演示 / R</button><button id="sound">声音</button></div>
<script>
'use strict';
const film=document.querySelector('#film'),ctx=film.getContext('2d'),W=1080,H=1920;
const gpu=document.createElement('canvas');gpu.width=1080;gpu.height=1250;
const gl=gpu.getContext('webgl',{alpha:true,preserveDrawingBuffer:true,antialias:false});
if(!gl)throw Error('浏览器未启用 WebGL，请开启硬件加速');
function shader(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
const vs=`attribute vec3 a;uniform float t;uniform float mode;varying vec3 col;varying float alpha;void main(){float u=a.x,v=a.y,w=a.z;float pi=3.14159265;float ang=u*6.2831853;float lat=acos(2.*v-1.);vec3 core=vec3(sin(lat)*cos(ang),cos(lat),sin(lat)*sin(ang))*(.13+.33*pow(w,.35));float r=.18+1.65*pow(v,.65);float spin=floor(u*3.)*2.094395+(fract(u*3.)-.5)*.38+r*3.5+t*.2094395;vec3 galaxy=vec3(cos(spin)*r,(w-.5)*.13,sin(spin)*r);float ra=1.05+.5*v;vec3 ring=vec3(cos(ang)*ra,(w-.5)*.06,sin(ang)*ra);if(w<.25)ring=core*1.35;vec3 wave=galaxy;wave.y+=.32*sin(r*8.-t*3.);float m=mode;vec3 p=m<1.?mix(core,galaxy,m):m<2.?mix(galaxy,ring,m-1.):mix(ring,wave,m-2.);float tilt=.57;float yy=p.y*cos(tilt)-p.z*sin(tilt);float zz=p.y*sin(tilt)+p.z*cos(tilt);p.y=yy;p.z=zz;float rot=.16*sin(t*.3);float xx=p.x*cos(rot)+p.z*sin(rot);p.z=-p.x*sin(rot)+p.z*cos(rot);p.x=xx;float depth=3.8+p.z;gl_Position=vec4(p.x*1.9/depth,p.y*1.65/depth,0.,1.);gl_PointSize=(1.5+3.8*w)*(3.8/depth);col=mix(vec3(.25,.93,.9),vec3(1.,.69,.31),smoothstep(.23,.9,w));alpha=.5+.5*sin(u*40.+t*1.5)*sin(u*40.+t*1.5);}`;
const fs=`precision mediump float;varying vec3 col;varying float alpha;void main(){float d=length(gl_PointCoord-.5)*2.;float glow=exp(-d*d*4.5);gl_FragColor=vec4(col,glow*alpha*.95);}`;
const prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,vs));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(prog));gl.useProgram(prog);
let seed=1927;function rand(){seed=(Math.imul(seed,1664525)+1013904223)|0;return (seed>>>0)/4294967296}
const N=26000,attrs=new Float32Array(N*3);for(let i=0;i<attrs.length;i++)attrs[i]=rand();let buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,attrs,gl.STATIC_DRAW);let loc=gl.getAttribLocation(prog,'a');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,3,gl.FLOAT,false,0,0);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE);const ut=gl.getUniformLocation(prog,'t'),um=gl.getUniformLocation(prog,'mode');
let manual=null,smoothed=1,camActive=false,landmarks=null,tracker=null,lastFrame=-1,paused=false,start=performance.now(),hold=0;
const ease=x=>1-Math.pow(1-Math.max(0,Math.min(1,x)),4);
function autoMode(t){if(t<3)return 1;if(t<7)return 2;if(t<9.5)return 0;if(t<12)return 1;if(t<15)return 2;if(t<18)return 2;if(t<21)return 3;if(t<22)return 0;if(t<24.3)return 1;if(t<26.5)return 3;if(t<28)return 2;return 1}
function timeline(t){if(t<3)return ['把星河，握在手里','捏住一颗星 · 张手即爆散','01 / 掌中星河'];if(t<7)return ['我让 AI 写了个网页','握拳聚拢，张手炸开，捏合成环','02 / 提示词'];if(t<9.5)return ['先把宇宙，收成一点','握拳 → 星核收缩','03 / 交互规则'];if(t<12)return ['再张开手','星核爆散 → 光环扩张','03 / 交互规则'];if(t<15)return ['两指一捏，星环成形','捏合 → 星尘绕成环','03 / 交互规则'];if(t<18)return ['一个网页，26,000 颗星','WebGL 粒子 · AI 编程作品','04 / 成品'];if(t<21)return ['挥一下，掀起星潮','移动方向 → 星河涌动','04 / 成品'];if(t<24.3)return ['最爽的是，连着来','聚拢 → 爆散 → 冲击波','05 / 连锁反应'];if(t<27)return ['星潮之后，再捏成环','一收一放，都是反馈','05 / 连锁反应'];return ['把星河，握在手里','想复现？评论「星河」拿提示词','06 / 再看一遍'];}
function text(s,x,y,size,color='#eef7f5',weight=600){ctx.fillStyle=color;ctx.font=`${weight} ${size}px "Microsoft YaHei",sans-serif`;ctx.fillText(s,x,y)}
const stars=Array.from({length:130},()=>[rand()*W,rand()*H,rand()*1.6+.4]);
function hand(mode,t){let cx=540+Math.sin(t*.7)*30,cy=1340;let open=mode<.5?.18:mode>1.5&&mode<2.5?.62:1;const pts=[[0,100],[-50,60],[-82,23],[-105,-15],[-115,-45],[-45,12],[-50,-55*open],[-52,-115*open],[-55,-165*open],[0,0],[0,-75*open],[0,-142*open],[0,-190*open],[40,12],[48,-58*open],[54,-117*open],[58,-164*open],[75,35],[91,-20*open],[101,-68*open],[110,-108*open]];if(mode>1.5&&mode<2.5){pts[4]=[-65,-100];pts[8]=[-60,-110]}
let p=pts.map(([x,y])=>[cx+x*.85,cy+y*.85]);if(camActive&&landmarks)p=landmarks.map(l=>[360+(1-l.x)*360,1210+l.y*300]);
const edges=[[0,1,2,3,4],[0,5,6,7,8],[5,9,10,11,12],[9,13,14,15,16],[13,17,18,19,20],[0,17]];ctx.lineWidth=2.5;ctx.strokeStyle='#56e9df99';ctx.shadowColor='#56e9df';ctx.shadowBlur=12;for(let e of edges){ctx.beginPath();e.forEach((k,i)=>i?ctx.lineTo(...p[k]):ctx.moveTo(...p[k]));ctx.stroke()}for(let [x,y]of p){ctx.beginPath();ctx.arc(x,y,4,0,7);ctx.fillStyle='#d8fffb';ctx.fill()}ctx.shadowBlur=0;ctx.setLineDash([6,12]);ctx.strokeStyle='#56e9df55';ctx.beginPath();ctx.moveTo(cx,1210);ctx.lineTo(540,1030);ctx.stroke();ctx.setLineDash([]);}
let frameCount=0,first=performance.now();
function renderAt(t,forced=false){t=((t%30)+30)%30;const target=manual===null?autoMode(t):manual;if(forced)smoothed=target;else smoothed+=(target-smoothed)*.085;
ctx.fillStyle='#060b12';ctx.fillRect(0,0,W,H);let bg=ctx.createRadialGradient(540,930,10,540,930,800);bg.addColorStop(0,'#102a31');bg.addColorStop(.6,'#08131d');bg.addColorStop(1,'#060b12');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
for(let [x,y,r]of stars){ctx.globalAlpha=.2+.35*(1+Math.sin(t*.8+x))*.5;ctx.fillStyle='#c1e4e8';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}ctx.globalAlpha=1;
gl.viewport(0,0,gpu.width,gpu.height);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);gl.uniform1f(ut,t);gl.uniform1f(um,smoothed);gl.drawArrays(gl.POINTS,0,N);ctx.drawImage(gpu,0,350);
// Two delayed reactions: a travelling shock ring and an expanding halo.
let phase=(t>=21&&t<24.3)?t-22:(t>=9.5&&t<12)?t-9.5:t<3?t:100;
if(phase>=0&&phase<2.3){for(let j=0;j<2;j++){let q=phase-j*.22;if(q<0)continue;ctx.save();ctx.translate(540,970);ctx.scale(1,.48);ctx.strokeStyle=`rgba(${j?'246,196,121':'86,233,223'},${Math.max(0,(1-q/2.3)*.5)})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,90+ease(q/2.3)*420,0,7);ctx.stroke();ctx.restore()}}
const [title,sub,kicker]=timeline(t);text('C O D E   /   C O S M O S',80,225,27,'#91a5af',400);text(kicker,80,290,28,'#56e9df',400);text(title,76,411,title.length>12?64:78);ctx.fillStyle='#f6c479';ctx.fillRect(80,450,76,4);
if(t>=3&&t<7){ctx.fillStyle='#09141ef0';ctx.strokeStyle='#56e9df66';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(80,525,870,230,18);ctx.fill();ctx.stroke();text('PROMPT / 提示词摘录',115,582,27,'#56e9df');let s='做一个能用手势控制的粒子星河';text(s.slice(0,Math.floor((t-3)*24)),115,650,43);text('握拳聚拢 · 张手爆散 · 捏合成环',115,711,35,'#d6dedb',400)}
hand(smoothed,t);text(camActive?'实时手势 / 本地识别':'手势骨架示意 / 自动演示',80,1458,27,'#91a5af',400);text(sub,80,1530,sub.length>19?36:43);ctx.strokeStyle='#263b44';ctx.beginPath();ctx.moveTo(80,1680);ctx.lineTo(950,1680);ctx.stroke();text('AI 编程作品  ·  程序动画演示',80,1730,26,'#91a5af',400);text('26K',846,1730,30,'#f6c479');ctx.fillStyle='#56e9df';ctx.fillRect(80,1677,870*t/30,4);frameCount++;
}
let previousHand=null;function animate(now){if(!paused)hold=(now-start)/1000;if(tracker&&camActive&&camera.readyState>=2&&camera.currentTime!==lastFrame){lastFrame=camera.currentTime;let result=tracker.detectForVideo(camera,now);landmarks=result.landmarks[0]||null;if(landmarks){let next=classify(landmarks);if(previousHand&&next===1&&Math.abs(landmarks[9].x-previousHand.x)/Math.max(.016,(now-previousHand.t)/1000)>1.1)next=3;previousHand={x:landmarks[9].x,t:now};manual=next}else previousHand=null}renderAt(hold);requestAnimationFrame(animate)}
function classify(l){let dist=(a,b)=>Math.hypot(l[a].x-l[b].x,l[a].y-l[b].y);const scale=Math.max(.01,dist(0,9));if(dist(4,8)/scale<.32)return 2;let extension=[8,12,16,20].filter((k)=>dist(k,0)>dist(k-2,0)*1.15).length;if(extension<=1)return 0;return 1}
window.classify=classify;window.renderAt=renderAt;window.stats=()=>({particles:N,glError:gl.getError(),frames:frameCount,averageFps:frameCount/((performance.now()-first)/1000)});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{manual=Number(b.dataset.mode);document.querySelector('#notice').textContent='手动控制 · 按 R 返回自动演示'});
document.querySelector('#demo').onclick=()=>{manual=null;start=performance.now();hold=0};document.querySelector('#enable').onclick=async()=>{let stream;try{document.querySelector('#notice').textContent='正在加载手势模型…';const {HandLandmarker,FilesetResolver}=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/vision_bundle.mjs');const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm');tracker=await HandLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'},runningMode:'VIDEO',numHands:1});stream=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480},audio:false});camera.srcObject=stream;await camera.play();camActive=true;document.querySelector('#notice').textContent='摄像头已开启 · 本地识别，不上传影像；无手时保持上个状态';document.querySelector('#enable').textContent='手势识别中';}catch(e){if(stream)stream.getTracks().forEach(t=>t.stop());camActive=false;manual=null;document.querySelector('#notice').textContent='摄像头/模型不可用，已回退自动演示。可用 1–4 或按钮控制。'+e.message}};
window.addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R')document.querySelector('#demo').click();if('1234'.includes(e.key))manual=Number(e.key)-1;if(e.code==='Space'){e.preventDefault();paused=!paused;if(!paused)start=performance.now()-hold*1000}if(e.key.toLowerCase()==='h')document.body.style.cursor=document.body.style.cursor==='none'?'auto':'none';if(e.key.toLowerCase()==='d'){let c=document.querySelector('#controls');c.hidden=!c.hidden;c.style.display=c.hidden?'none':'flex'}});
film.onpointerdown=()=>manual=0;film.onpointerup=()=>manual=1;film.onpointercancel=()=>manual=1;film.onpointermove=e=>{if(e.buttons)manual=2};
let audio;
function makeAudio(){const ac=new AudioContext(),dest=ac.createMediaStreamDestination(),master=ac.createGain();master.gain.value=.23;master.connect(dest);master.connect(ac.destination);let base=ac.currentTime+.12;function note(time,hz,duration,vol,type='sine'){let o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(hz,base+time);g.gain.setValueAtTime(0,base+time);g.gain.linearRampToValueAtTime(vol,base+time+.01);g.gain.exponentialRampToValueAtTime(.0001,base+time+duration);o.connect(g);g.connect(master);o.start(base+time);o.stop(base+time+duration+.03)}for(let beat=0;beat<56;beat++){let t=beat*60/112;note(t,beat%4===0?55:110,.42,.65);note(t+.267,[440,554.37,659.25,830.61][beat%4],.32,.13,'triangle');}for(let t of [0,9.5,12,15,18,22,22.22,24.3,26.5]){note(t,82.41,.85,.9);note(t+.2,659.25,.8,.3);note(t+.28,987.77,.65,.2)}return {ac,dest}}
document.querySelector('#sound').onclick=()=>{if(!audio){audio=makeAudio();document.querySelector('#sound').textContent='原创合成音轨播放中'}};
window.recordFilm=async()=>{paused=false;manual=null;audio=makeAudio();await audio.ac.resume();const stream=film.captureStream(30);for(const track of audio.dest.stream.getAudioTracks())stream.addTrack(track);const mime='video/mp4;codecs=avc1.42001E,mp4a.40.2';if(!MediaRecorder.isTypeSupported(mime))throw Error('当前浏览器不支持MP4导出');let chunks=[];const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:12000000,audioBitsPerSecond:192000});let done=new Promise(resolve=>rec.onstop=resolve);rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};start=performance.now();hold=0;renderAt(0,true);rec.start(1000);await new Promise(r=>setTimeout(r,30000));rec.stop();await done;let blob=new Blob(chunks,{type:'video/mp4'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='palm-galaxy-douyin.mp4';window.recordedBlob=blob;if(!window.automatedExport)a.click();await audio.ac.close();return {bytes:blob.size,mime:blob.type,stats:window.stats()}};
if(new URLSearchParams(location.search).has('clean')){document.querySelector('#controls').style.display='none';document.querySelector('#notice').style.display='none'}requestAnimationFrame(animate);
</script></html>
