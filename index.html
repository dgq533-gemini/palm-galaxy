<div class="wrap">
  <header>

<script>
'use strict';
// 作品列表 — 新增作品只需在此添加一项（title/desc/tags 均需中英文）
const WORKS=[
  {
    num:'01',
    title:{zh:'掌中星河',en:'Palm Galaxy'},
    enSub:'PALM GALAXY',
    desc:{zh:'26,000 颗星，握在手里。握拳聚拢，张手爆散，捏合成环 — WebGL 粒子星河，支持手势控制。',en:'26,000 stars in your palm. Fist to gather, open to burst, pinch to form a ring — WebGL particle galaxy with gesture control.'},
    tags:{zh:['WebGL','粒子系统','手势识别','MediaPipe'],en:['WebGL','Particles','Gesture','MediaPipe']},
    url:'galaxy.html'
  },
  {
    num:'02',
    title:{zh:'雨港 2077',en:'Rainy Harbor 2077'},
    enSub:'NEON AFTER RAIN',
    desc:{zh:'雨夜的霓虹城市，灯光与倒影同步呼吸。点击唤醒整条街，让光沿着雨夜蔓延。',en:'A neon city in the rain, lights and reflections breathe together. Click to wake the whole street, let light spread through the rainy night.'},
    tags:{zh:['Canvas 2D','赛博朋克','动画','合成音轨'],en:['Canvas 2D','Cyberpunk','Animation','Synth Track']},
    url:'yugang.html'
  },
  {
    num:'03',
    title:{zh:'以你之名的宇宙',en:'Universe of You'},
    enSub:'UNIVERSE OF YOU',
    desc:{zh:'输入一个名字，生成专属的星空宇宙。粒子从心形聚成名字，再绽成星系 — 星星有很多，但我的宇宙里，只有你。',en:'Enter a name to generate a专属 starry universe. Particles gather from a heart into the name, then bloom into a galaxy — countless stars, but only you in my universe.'},
    tags:{zh:['Canvas 2D','粒子系统','名字生成','心形数学'],en:['Canvas 2D','Particles','Name Gen','Heart Math']},
    url:'yinizhiming261021.html'
  }
];
const grid=document.getElementById('grid');
function renderWorks(){
  const L=i18n.lang;
  grid.innerHTML='';
  WORKS.forEach(w=>{
    const a=document.createElement('a');
    a.className='card';a.href=w.url;
    a.innerHTML=`<div class="card-num">${w.num} / ${String(WORKS.length).padStart(2,'0')}</div>
      <div class="card-title">${w.title[L]}</div>
      <div class="card-en">${w.enSub}</div>
      <div class="card-desc">${w.desc[L]}</div>
      <div class="tags">${w.tags[L].map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      <div class="enter">${i18n.t('enterWork')} <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>`;
    grid.appendChild(a);
  });
}
i18n.setDict({
  zh:{
    pageTitle:'Alepha · AI 编程作品集',
    kicker:'AI Coding Art Collection',
    subtitle:'用代码描绘星河与雨夜 — AI 编程作品集，每一件作品都是一次程序与想象的共振。',
    brandLine:'A L E P H A  ·  A I 编 程 作 品 集',
    footer:'© 2026 Alepha · 所有作品均为 AI 辅助编程创作',
    enterWork:'进入作品',
    supportText:'如果你喜欢这些作品，欢迎在爱发电支持我 ☕',
    supportBtn:'爱发电支持'
  },
  en:{
    pageTitle:'Alepha · AI Coding Art Collection',
    kicker:'AI Coding Art Collection',
    subtitle:'Code-painted galaxies and rainy nights — an AI coding art collection where every work is a resonance between program and imagination.',
    brandLine:'A L E P H A  ·  AI CODING ART',
    footer:'© 2026 Alepha · All works are AI-assisted coding creations',
    enterWork:'Enter Work',
    supportText:'If you enjoy these works, consider supporting me on Afdian ☕',
    supportBtn:'Support on Afdian'
  }
});
renderWorks();
document.addEventListener('langchange',renderWorks);
// 星空背景
const c=document.getElementById('stars'),g=c.getContext('2d');
let W,H,stars;
function resize(){W=c.width=innerWidth;H=c.height=innerHeight;stars=Array.from({length:Math.min(180,Math.floor(W*H/9000))},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.3,s:Math.random()*.5+.1,p:Math.random()*6.28}))}
resize();addEventListener('resize',resize);
(function draw(t){g.clearRect(0,0,W,H);for(let s of stars){let a=.25+.35*Math.sin(t*.001*s.s+s.p);g.globalAlpha=a;g.fillStyle='#c1e4e8';g.beginPath();g.arc(s.x,s.y,s.r,0,7);g.fill()}g.globalAlpha=1;requestAnimationFrame(draw)})(0);
</script>
